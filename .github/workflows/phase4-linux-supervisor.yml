name: Phase 4 Linux gate

on:
  workflow_dispatch:
  push:
    branches:
      - codex/phase2-poc-baseline
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase4-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-supervisor:
    name: Native supervisor boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prove Linux host and compile native kernels
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.platform')" = "linux"
          cc \
            native/openclaw-process-supervisor.c \
            -std=c11 \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -fsyntax-only
          cc \
            native/openclaw-fs-kernel.c \
            -std=c11 \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -o "${RUNNER_TEMP}/agentmo-openclaw-fs-kernel"

      - name: Execute Linux containment and credential regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 60s node --test \
            test/openclaw-credential-handoff.test.js
          timeout --signal=KILL 60s node --test \
            --test-name-pattern='^(?!.*(?:direct pidfd admission fails|bootstrap clock admission fails))' \
            test/openclaw-process-supervisor.test.js
          timeout --signal=KILL 20s node --test \
            --test-name-pattern='direct pidfd admission fails' \
            test/openclaw-process-supervisor.test.js
          timeout --signal=KILL 20s node --test \
            --test-name-pattern='bootstrap clock admission fails' \
            test/openclaw-process-supervisor.test.js

  main-regression:
    name: Main regression shard ${{ matrix.shard }}
    needs: native-supervisor
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24 for OpenClaw-compatible regressions
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run one stable main-test shard
        shell: bash
        env:
          AGENTMO_TEST_LANE: main
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 6
        run: |
          set -euo pipefail
          mapfile -t files < <(find test -type f -name '*.js' -print | LC_ALL=C sort)
          selected=()
          for index in "${!files[@]}"; do
            if (( index % SHARD_TOTAL == SHARD_INDEX )); then
              selected+=("${files[index]}")
            fi
          done
          test "${#selected[@]}" -gt 0
          node --test --test-concurrency=1 "${selected[@]}"

  publication-and-packed:
    name: Syntax, packed behavior, and publication
    needs: native-supervisor
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24 for OpenClaw-compatible regressions
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check shipped and repository JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find bin plugin scripts src -type f -name '*.js' -print | LC_ALL=C sort)

      - name: Run packed behavior lanes
        run: |
          npm run check:test:packed-hook-chain
          npm run check:test:packed-behavior

      - name: Verify publication inventory
        shell: bash
        run: |
          set -euo pipefail
          npm pack \
            --dry-run \
            --json \
            --cache "${RUNNER_TEMP}/agentmo-npm-cache"

      - name: Reject whitespace damage
        shell: bash
        run: |
          set -euo pipefail
          git diff --check \
            "origin/${{ github.event.repository.default_branch }}...HEAD"
